<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Collaborating AI agents"><title>Collaborating AI agents</title><style>.ink{fill:#334155}.muted{fill:#64748b}.accent{stroke:#0d9488}.float{animation:float 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:5 9;animation:flow 2s linear infinite}.blink{animation:blink 1.2s steps(1) infinite}@keyframes float{50%{transform:translateY(-4px)}}@keyframes pulse{50%{opacity:.4}}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes blink{50%{opacity:0}}@media(prefers-color-scheme:dark){.ink{fill:#e2e8f0}.muted{fill:#a3b3c5}}@media(prefers-reduced-motion:reduce){.float,.pulse,.flow,.blink{animation:none}}</style><g fill="none" stroke="#0d9488" stroke-width="2"><path d="M32 29 L12 13 M32 29 L52 13 M32 29 L12 51 M32 29 L52 51" class="flow"/><circle cx="32" cy="29" r="9"/><circle cx="12" cy="13" r="6" class="pulse"/><circle cx="52" cy="13" r="6"/><circle cx="12" cy="51" r="6"/><circle cx="52" cy="51" r="6" class="pulse"/></g></svg>
