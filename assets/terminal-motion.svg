<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Mobile terminal"><title>Mobile terminal</title><style>.ink{fill:#334155}.muted{fill:#64748b}.accent{stroke:#0d9488}.float{animation:float 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:5 9;animation:flow 2s linear infinite}.blink{animation:blink 1.2s steps(1) infinite}@keyframes float{50%{transform:translateY(-4px)}}@keyframes pulse{50%{opacity:.4}}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes blink{50%{opacity:0}}@media(prefers-color-scheme:dark){.ink{fill:#e2e8f0}.muted{fill:#a3b3c5}}@media(prefers-reduced-motion:reduce){.float,.pulse,.flow,.blink{animation:none}}</style><g fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><rect x="16" y="5" width="32" height="54" rx="6"/><path d="M27 11 H37 M26 54 H38 M24 25 L30 30 L24 35"/><path d="M34 35 H40" class="blink"/><path d="M54 18 Q62 28 54 38" class="pulse"/></g></svg>
