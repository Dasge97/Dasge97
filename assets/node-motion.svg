<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 86 76" width="86" height="76" role="img" aria-label="Node.js"><title>Node.js</title><style>.ink{fill:#334155}.muted{fill:#64748b}.accent{stroke:#0d9488}.float{animation:float 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:5 9;animation:flow 2s linear infinite}.blink{animation:blink 1.2s steps(1) infinite}@keyframes float{50%{transform:translateY(-4px)}}@keyframes pulse{50%{opacity:.4}}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes blink{50%{opacity:0}}@media(prefers-color-scheme:dark){.ink{fill:#e2e8f0}.muted{fill:#a3b3c5}}@media(prefers-reduced-motion:reduce){.float,.pulse,.flow,.blink{animation:none}}</style><g class="float" style="animation-delay:-0.4s"><circle cx="43" cy="27" r="19" fill="none" stroke="#39804b" stroke-width="1.5" stroke-opacity=".35"/><text x="43" y="33" fill="#39804b" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">N</text></g><text x="43" y="66" class="ink" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">Node.js</text></svg>
