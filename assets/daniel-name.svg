<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 194" width="900" height="194" role="img" aria-label="Daniel Svetoslavov — animated signature"><title>Daniel Svetoslavov — animated signature</title><style>.ink{fill:#334155}.muted{fill:#64748b}.accent{stroke:#0d9488}.float{animation:float 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:5 9;animation:flow 2s linear infinite}.blink{animation:blink 1.2s steps(1) infinite}@keyframes float{50%{transform:translateY(-4px)}}@keyframes pulse{50%{opacity:.4}}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes blink{50%{opacity:0}}@media(prefers-color-scheme:dark){.ink{fill:#e2e8f0}.muted{fill:#a3b3c5}}@media(prefers-reduced-motion:reduce){.float,.pulse,.flow,.blink{animation:none}}</style><defs><linearGradient id="signature" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0d9488"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
<style>.name{font:700 57px 'Segoe UI',Arial,sans-serif;letter-spacing:-2px}.write{fill:url(#signature);stroke:url(#signature);stroke-width:1;stroke-dasharray:850;animation:write 9s ease-in-out infinite}.underline{stroke-dasharray:480;animation:line 9s ease-in-out infinite}@keyframes write{0%{stroke-dashoffset:850;fill-opacity:0}30%{stroke-dashoffset:0;fill-opacity:0}45%,90%{stroke-dashoffset:0;fill-opacity:1}100%{stroke-dashoffset:850;fill-opacity:0}}@keyframes line{0%,20%{stroke-dashoffset:480}48%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:480}}@media(prefers-reduced-motion:reduce){.write,.underline{animation:none;stroke-dashoffset:0;fill-opacity:1}}</style>
