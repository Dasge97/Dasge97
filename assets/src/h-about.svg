<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Typewriter text for ~/about">
      <defs>
        <linearGradient id="tt-bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#04120a" />
          <stop offset="100%" stop-color="#020805" />
        </linearGradient>
        <pattern id="tt-scan" width="1" height="4" patternUnits="userSpaceOnUse">
          <rect width="1" height="4" fill="transparent" />
          <rect width="1" height="1" y="0" fill="#4ade80" opacity="0.05" />
        </pattern>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
          @keyframes tt-show { from { opacity: 0; } to { opacity: 1; } }
          .tt-l { opacity: 0; animation: tt-show 0.05s linear forwards; }
          @keyframes tt-advance { from { transform: translateX(0); } to { transform: translateX(434.0px); } }
          @keyframes tt-blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
          .tt-caret { animation: tt-advance 0.77s steps(7) forwards, tt-blink 1.06s step-end infinite; }
        </style>
      </defs>
      
      <text class="tt-l" style="animation-delay:0.000s" x="224" y="150" text-anchor="middle" font-size="94" font-family="'Space Mono','JetBrains Mono',monospace" font-weight="700" fill="#86efac">~</text><text class="tt-l" style="animation-delay:0.110s" x="286" y="150" text-anchor="middle" font-size="94" font-family="'Space Mono','JetBrains Mono',monospace" font-weight="700" fill="#86efac">/</text><text class="tt-l" style="animation-delay:0.220s" x="348" y="150" text-anchor="middle" font-size="94" font-family="'Space Mono','JetBrains Mono',monospace" font-weight="700" fill="#86efac">a</text><text class="tt-l" style="animation-delay:0.330s" x="410" y="150" text-anchor="middle" font-size="94" font-family="'Space Mono','JetBrains Mono',monospace" font-weight="700" fill="#86efac">b</text><text class="tt-l" style="animation-delay:0.440s" x="472" y="150" text-anchor="middle" font-size="94" font-family="'Space Mono','JetBrains Mono',monospace" font-weight="700" fill="#86efac">o</text><text class="tt-l" style="animation-delay:0.550s" x="534" y="150" text-anchor="middle" font-size="94" font-family="'Space Mono','JetBrains Mono',monospace" font-weight="700" fill="#86efac">u</text><text class="tt-l" style="animation-delay:0.660s" x="596" y="150" text-anchor="middle" font-size="94" font-family="'Space Mono','JetBrains Mono',monospace" font-weight="700" fill="#86efac">t</text>
      <rect class="tt-caret" x="193.0" y="68" width="14" height="90" rx="1" fill="#4ade80" />
      
    </svg>